[pytest]
markers =
    web: Flask route/page tests
    buttons: "Pull Data" and "Update Analysis" Analysis behavior
    analysis: formatting/rounding of analysis output
    db: database schema/inserts/selects
    integration: end-to-end flows
    helpers: tests for helper functions (e.g. data mapping, formatting)
    no_cover: disable coverage for this test (e.g. if it tests a branch that is hard to trigger)    
addopts = --cov=src --cov-report=term-missing --cov-fail-under=100