<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Applicants{% endblock %}-Applicant Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0 20px 20px;
            background: #f4f6f8;
            color: #2c3e50;
        }

        nav {
            background: #ffffff;
            padding: 16px 20px;
            border-bottom: 1px solid #dfe3e6;
        }

        nav a {
            color: #607d8b;
            font-size: 1.8em;
            text-decoration: none;
        }

        .content {
            max-width: 1100px;
            margin: 20px auto;
        }

        .top-actions {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .action-card {
            background: #ffffff;
            border: 1px solid #dfe3e6;
            border-radius: 10px;
            padding: 16px;
            flex: 1 1 320px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .action-card form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-card button {
            padding: 12px 18px;
            background: #467fcf;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .action-card button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-info {
            background: #eef7ff;
            border: 1px solid #c7e0ff;
            color: #1f497d;
        }

        .alert-warning {
            background: #fff4e0;
            border: 1px solid #ffdd99;
            color: #7a4b00;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
        }

        .stat-block {
            background: #ffffff;
            border: 1px solid #dfe3e6;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .stat-block h2 {
            font-size: 1.05em;
            margin-bottom: 10px;
        }

        .stat-block p {
            font-size: 1.2em;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Applicant Management System</a>
    </nav>
    <hr>
    <div class="content">
    {% block content %}
    {% endblock %}
    </div>
</body>
</html>
